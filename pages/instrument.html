<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструмент</title>
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #instrument-preloader {
            position: fixed;
            inset: 0;
            background: rgb(10, 10, 20);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #instrument-preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #instrument-preloader .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #9d4edd;
            border-radius: 50%;
            animation: instrumentSpin 1s infinite linear;
        }
        @keyframes instrumentSpin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="instrument-preloader"><div class="spinner"></div></div>

    <div id="melodic-root" style="display:none;">
        <button id="exit">Выход</button>
        <h1 id="instrument-title"></h1>

        <div id="note-menu" class="note-popup">
            <button data-melodic-action="noteMenuSplit">Разделить(S)</button>
            <button data-melodic-action="noteMenuMerge">Соединить(W)</button>
            <button data-melodic-action="addNoteForKey">Добавить(A)</button>
            <button data-melodic-action="delNoteFromKey">Удалить(D)</button>
            <button data-melodic-action="CDTie">С/У лигу</button>
        </div>
        <div id="bar-menu" class="bar-popup">
            <button data-melodic-action="duplicateBar">Дублировать(E)</button>
            <button data-melodic-action="deleteBar">Удалить(R)</button>
            <button data-melodic-action="rightBar">Вправо</button>
            <button data-melodic-action="leftBar">Влево</button>
            <button data-melodic-action="startOfRepeat">Начало репризы</button>
            <button data-melodic-action="endOfRepeat">Конец репризы</button>
        </div>
        <div id="countRepeats" class="bar-popup" style="display: none;">
            <label for="repeatCount">Количество повторений (мин. 2):</label>
            <input type="number" id="repeatCount" min="2" value="2">
            <button data-melodic-action="confirmRepeat">Подтвердить</button>
            <button data-melodic-action="cancelRepeat">Отмена</button>
        </div>

        <div class="piano-container" id="piano">
            <div class="switch-wrapper">
                <label class="switch">
                    <input type="checkbox" id="check">
                    <span class="slider"></span>
                </label>
                <span class="switch-label">LET RING</span>
            </div>
        </div>

        <br>
        <button id="BPlay"><img src="../assets/images/instruments/play.png" width="100%" id="imgBPlay"></button>
        <br>
        <input type="text" id="tempo" placeholder="Tempo" min="10" max="300"><br>
        <div id="staff">
            <div class="time-signature">
                <span data-time-sig="top">&nbsp;4</span>
                <br>---<br>
                <span data-time-sig="bottom">&nbsp;4</span>
            </div>
            <button id="BAddBar">Добавить<br>такт(T)</button>
        </div>
    </div>

    <div id="drums-root" style="display:none;">
        <div class="clue">
            0 - бас-бочка<br>
            1 - крэш<br>
            2 - райд<br>
            3 - малый<br>
            4 - закрытый хай-хет<br>
            5 - открытый хай-хет<br>
            6 - педаль хай-хета<br>
            7 - напольный том<br>
            8 - средний том<br>
            9 - высокий том<br>
            - - стик<br>
            = - бел райда
        </div>
        <div class="overlay">
            <button id="exit">Выход</button>
            <h1 id="instrument-title">УДАРНЫЕ</h1>
            <div id="note-menu" class="note-popup">
                <button data-drums-action="noteMenuSplit">Разделить(S)</button>
                <button data-drums-action="noteMenuMerge">Соединить(W)</button>
                <button data-drums-action="addNote">Добавить(A)</button>
                <button data-drums-action="delNote">Удалить(D)</button>
            </div>
            <div id="bar-menu" class="bar-popup">
                <button data-drums-action="duplicateBar">Дублировать(E)</button>
                <button data-drums-action="deleteBar">Удалить(R)</button>
                <button data-drums-action="rightBar">Вправо</button>
                <button data-drums-action="leftBar">Влево</button>
                <button data-drums-action="startOfRepeat">Начало репризы</button>
                <button data-drums-action="endOfRepeat">Конец репризы</button>
            </div>
            <div id="countRepeats" class="bar-popup" style="display: none;">
                <label for="repeatCount">Количество повторений (мин. 2):</label>
                <input type="number" id="repeatCount" min="2" value="2">
                <button data-drums-action="confirmRepeat">Подтвердить</button>
                <button data-drums-action="cancelRepeat">Отмена</button>
            </div>

            <div class="drums">
                <img src="../assets/images/instruments/drums.png" id="drumsI">
                <div class="hi-hat" data-drum-sample="cHH"></div>
                <div class="open-hi-hat" data-drum-sample="oHH"></div>
                <div class="pedal-hi-hat" data-drum-sample="pHH"></div>
                <div class="snare" data-drum-sample="snare"></div>
                <div class="bassDrum" data-drum-sample="bassDrum"></div>
                <div class="floorTom" data-drum-sample="lowTom"></div>
                <div class="midTom" data-drum-sample="midTom"></div>
                <div class="hiTom" data-drum-sample="hiTom"></div>
                <div class="crash" data-drum-sample="crash"></div>
                <div class="ride" data-drum-sample="ride"></div>
            </div>

            <br>
            <button id="BPlay"><img src="../assets/images/instruments/play.png" width="100%" id="imgBPlay"></button>
            <br>
            <input type="text" id="tempo" placeholder="Tempo" min="10" max="300"><br>
            <div id="staff">
                <div class="time-signature">
                    <span data-time-sig="top">&nbsp;4</span>
                    <br>---<br>
                    <span data-time-sig="bottom">&nbsp;4</span>
                </div>
                <button id="BAddBar">Добавить<br>такт(T)</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/pages/instrument-page.js"></script>
</body>
</html>
