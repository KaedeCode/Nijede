<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>НИДЖИКА</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components/sidebar.css">
    <link rel="stylesheet" href="../css/components/novel.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        window.modelsLoadedPromise = new Promise(resolve => {
            window.resolveModelsLoaded = resolve;
        });
    </script>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Загрузка комнаты Ниджики...</p>
            <p class="loading-subtext">Первая загрузка может занять некоторое время</p>
        </div>
    </div>

    <div class="burger-button">☰</div>

    <div class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Меню</span>
            <button class="close-sidebar" aria-label="Закрыть">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" href="../index.html">🏠 Главная</a>
            <a class="sidebar-link" href="nijika.html">🎸 Ниджика</a>
            <a class="sidebar-link" href="kaede.html">🎹 Каэде</a>
            <a class="sidebar-link" data-action="show-popup">ℹ️ Инфо</a>
            <a class="sidebar-link" data-action="show-feedback">💬 Обратная связь</a>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск инструментов...">
                <div id="searchDropdown" class="search-dropdown"></div>
            </div>
        </nav>
        <div class="sidebar-music">
            <div class="music-row">
                <button class="music-btn" data-music-toggle>🎵</button>
                <span>Музыка</span>
            </div>
            <input type="range" class="volume-slider" min="0" max="100" value="30" data-volume>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="../assets/audio/music/to_live_is_to_die.opus" type="audio/mpeg">
    </audio>

    <script type="module" src="../js/pages/nijika-page.js"></script>
</body>
</html>
